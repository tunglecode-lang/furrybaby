<style>

const ALPH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz+/';
function rgbOf(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function clsOf(h){const [r,g,b]=rgbOf(h),lum=.3*r+.59*g+.11*b;
  if(g>r+6&&g>b+6)return 'green';if(r>120&&g<62&&b<75)return 'red';if(lum>190)return 'light';if(lum>135)return 'tan';return 'dark';}
function prep(D){const W=D.w,H=D.h,G=D.rows.map(r=>[...r].map(c=>c==='.'?-1:ALPH.indexOf(c)));
  const C=D.pal.map(clsOf);
  /* biên thân (da, áo, váy) theo từng hàng để biết tóc nào ở ngoài */
  const bl=[],br=[];for(let j=0;j<H;j++){let a=1e9,b=-1;for(let i=0;i<W;i++){const v=G[j][i];if(v>=0&&(C[v]==='light'||C[v]==='green')){if(i<a)a=i;if(i>b)b=i;}}bl.push(a);br.push(b);}
  return {G,W,H,C,bl,br,skin:D.skin,line:D.line};}

  const tap=(t%3.4)<.4;
  if(tap){const mv=[];for(let j=98;j<=124;j++)for(let i=47;i<=65;i++){const v=base[j][i];if(v>=0)mv.push([j,i,v]);}

  /* 4) nhún thở: kéo phần thân trên lên 1 hàng */
  const bob=Math.sin(t*2.0)>.35?1:0;let res=base;
  if(bob){res=base.map(r=>r.slice());for(let j=0;j<97;j++)res[j]=base[j+1].slice();}
  /* 5) chớp mắt */
  const cyc=t%4.4;
  if(cyc>4.15||(cyc>2.0&&cyc<2.15)){
    [[33,39],[50,56]].forEach(([x0,x1])=>{const dj=bob?-1:0;
      for(let j=38;j<=45;j++)for(let i=x0;i<=x1;i++){const jj=j+dj;if(jj<0)continue;const v=res[jj][i];if(v<0)continue;const [r,g,b]=rgbOf(S.pal?S.pal[v]:'#000');if(true){res[jj][i]=S.skin;}}
      for(let i=x0;i<=x1;i++){const jj=43+dj;res[jj][i]=S.line;}});}
  return {grid:res,dy:0};}

const S=prep(D);S.pal=D.pal;
const M=14,CW=S.W+M*2,CH=S.H+M*2+2;
const cv=document.getElementById('cv');cv.width=CW;cv.height=CH;const x=cv.getContext('2d');
let anim=true,fast=false,check=false,acc=0,last=performance.now();
const lv=[];for(let i=0;i<8;i++)lv.push({x:Math.random()*CW,y:Math.random()*CH,v:.35+Math.random()*.5,p:Math.random()*6,c:['#d9a066','#b5703f','#e8c08a','#c8884a'][i%4]});
function draw(tt){
  x.clearRect(0,0,CW,CH);
  if(check){for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){x.fillStyle=((i>>2)+(j>>2))&1?'#f1e4d4':'#fbf3ea';x.fillRect(i,j,1,1);}}
  const f=compose(S,anim?tt:0,{static:!anim});
  x.fillStyle='rgba(90,60,40,.16)';const by=M+S.H;for(let i=-26;i<=26;i++)x.fillRect(Math.round(CW/2+i),by,1,1);for(let i=-18;i<=18;i++)x.fillRect(Math.round(CW/2+i),by+1,1,1);
  for(let j=0;j<S.H;j++)for(let i=0;i<S.W;i++){const v=f.grid[j][i];if(v<0)continue;x.fillStyle=D.pal[v];x.fillRect(M+i,M+j,1,1);}
  if(anim)lv.forEach(s=>{const yy=((s.y+tt*7*s.v)%CH),px=Math.round(s.x+Math.sin(tt*1.2+s.p)*4),py=Math.round(yy);x.fillStyle=s.c;x.fillRect(px,py,2,1);x.fillRect(px+1,py+1,2,1);});}
function loop(now){const dt=(now-last)/1000;last=now;if(anim)acc+=dt*(fast?1.8:1);draw(acc);requestAnimationFrame(loop);}
const bA=document.getElementById('bAnim'),bS=document.getElementById('bSpd'),bB=document.getElementById('bBg');
bA.onclick=()=>{anim=!anim;bA.setAttribute('aria-pressed',anim)};bS.onclick=()=>{fast=!fast;bS.setAttribute('aria-pressed',fast)};bB.onclick=()=>{check=!check;bB.setAttribute('aria-pressed',check)};
requestAnimationFrame(loop);
</script></body></html>
