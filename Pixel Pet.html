...........................", "............_UUWUSSSYUUUUUU_.........Z\\QQQQQQQQOVVVV_......^WQQQOOOOOOOOOPXV_.....____.............................", "............_WUYUUU[UUUUUU^.........O\\QQQQQQQQQVVVV\\......_XQQQQQQQQQOOOPVXZ^......................................", "............_UU[UUU\\UUUUU^.........PUQQQQQQQQQUVVVV_......_VQQQQQQQQQQOOVXV^.......................................", "............._W[UUUWUUUU_.........V\\USQQQQQQUUUUVV^......._VUUWQQQQWQQUVXX_........................................", "..............^^^^^^^^^^..........]\\UUUYUUU[UUUUUV^......._UU[UUUU[UUUUXV^.........................................", "..................................]ZUU[UUUU\\UUUUW^........._W[SUUU\\UUUSX^..........................................", "....................................^U[UUUU\\UUUU^...........^[WUUU[WUUW^...........................................", "....................................R][UUUUU\\SU_.............^_^^^^^^^^............................................", ".....................................P__^^^^^^^....................................................................", "...................................................................................................................", "...................................................................................................................", "...................................................................................................................", "...................................................................................................................", "...................................................................................................................", "..................................................................................................................."],PAL=["#ffffff", "#fffeff", "#fffefe", "#fefeff", "#fefefe", "#fefefd", "#fdfefe", "#fefdfe", "#fefdfd", "#fdfdfd", "#fcfcfd", "#f9fafc", "#f5f8fc", "#f1f7fd", "#edf3fb", "#e3e const pid=src.map((r,y)=>r.map((c,x)=>{
 if(c=='.')return -1;
 if(x<=72&&y<=57)return 3;
 if((x>=74&&y<=76)||(x>=82&&y>76)||(x>=68&&y<=58))return 1;
 if(x<=37&&y>=80)return 2;
 if(x>=36&&x<=54&&y>=98)return 4;
 if(x>=57&&x<=74&&y>=99)return 5;
 return 0}));
const eyes=[];src.forEach((r,y)=>r.forEach((c,x)=>{if(c==EYE)eyes.push([x,y])}));
function build(act,t){
 const o=Array.from({length:H},()=>Array(N).fill('.'));
 const s=Math.sin;let by=0,tail=s(t*1.5)*.05,hy=s(t*2)>0?0:1,leg=0,fp=0,bp=0,blink=(t%3.6)<.18;
 if(act=='wag')tail=s(t*9)*.2;
 if(act=='walk'){by=s(t*12)>.6?-1:0;tail=s(t*3)*.08;fp=-Math.round(Math.max(0,s(t*6))*3);bp=-Math.round(Math.max(0,-s(t*6))*3);hy=by==0?1:0}
 if(act=='jump'){by=-Math.round(Math.abs(s(t*3))*24);tail=s(t*6)*.12}
 if(act=='wave')leg=s(t*8)*.32;
 if(act=='sleep'){hy=3+(s(t*1.2)>0?0:1);blink=true;tail=s(t*.8)*.03}

 const rot=(part,px,py,a,dx,dy)=>{const ca=Math.cos(a),sa=Math.sin(a);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
   const rx=x-dx-px,ry=y-dy-py;const sx=Math.round(px+ca*rx+sa*ry),sy=Math.round(py-sa*rx+ca*ry);
   if(sx>=0&&sx<N&&sy>=0&&sy<N&&pid[sy][sx]==part)put(x,y+PAD,src[sy][sx])}};
 const shift=(part,dx,dy)=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(pid[y][x]==part){let c=src[y][x];
   if(part==3&&blink){if(c==EYE)c=LIGHT;if(c==PUP)c=DARK}put(x+dx,y+dy+PAD,c)}};

 shift(3,0,by+hy);
 if(blink)eyes.forEach(([x,y])=>{const below=!eyes.some(e=>e[0]==x&&e[1]==y+1);if(below)put(x,y+hy+by+PAD,DARK)});

const A=[['idle','Đứng yên'],['wag','Vẫy đuôi'],['walk','Đi bộ'],['jump','Nhảy'],['wave','Vẫy chân'],['sleep','Ngủ']];

requestAnimationFrame(loop);
